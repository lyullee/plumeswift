[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "plumeswift"
dynamic = ["version"]
description = "Research tools for 3D wind fields, particle dispersion, and liquid hydrogen release"
readme = "PYPI.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.15,<1.16", "netCDF4>=1.6"]
license = "GPL-3.0-only AND LGPL-2.1-or-later"
license-files = ["LICENSE", "LICENSE.LGPL-2.1", "NOTICE.md"]
keywords = ["QES", "dispersion", "wind", "liquid hydrogen", "Lagrangian"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.urls]
Repository = "https://github.com/lyullee/plumeswift"
Issues = "https://github.com/lyullee/plumeswift/issues"
Documentation = "https://github.com/lyullee/plumeswift#readme"
"Historical QESx archive" = "https://doi.org/10.5281/zenodo.24073832"
Upstream = "https://github.com/UtahEFD/QES-Public"

[project.scripts]
plumeswift = "plumeswift.__main__:main"

[project.optional-dependencies]
fast = ["numba>=0.68,<0.69"]
thermo = ["CoolProp>=7"]
test = ["pytest>=8"]
gis = ["pyshp>=2.3,<4", "rasterio>=1.3", "fiona>=1.9,<2"]
cuda11 = ["cupy-cuda11x>=13.4,<14"]
plot = ["matplotlib>=3.6"]
visual = ["plotly>=6.0,<7", "scikit-image>=0.23,<1"]
ffi = ["pypdf[crypto]>=6,<7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["plumeswift*"]

[tool.setuptools.dynamic]
version = {attr = "plumeswift.__version__"}

[tool.setuptools.package-data]
plumeswift = ["fire_data/HeatPot.nc", "example_data/*.json", "example_data/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
