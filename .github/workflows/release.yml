name: Build and publish Python package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build --outdir dist python_qes
          python -m twine check --strict dist/*
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            version="$(python -c 'import sys; sys.path.insert(0, "python_qes"); from plumeswift import __version__; print(__version__)')"
            test "$GITHUB_REF_NAME" = "v$version"
          fi
      - name: Install and test the built wheel
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          python -m pip install "${wheel}[fast,test,visual]"
          cd "$RUNNER_TEMP"
          python -m plumeswift info
          python -m plumeswift plume-managed-container --steps 20 --release-per-step 16 --seed 0
          mkdir tests
          cp "$GITHUB_WORKSPACE/python_qes/tests/test_components.py" \
             "$GITHUB_WORKSPACE/python_qes/tests/test_numerics.py" \
             "$GITHUB_WORKSPACE/python_qes/tests/test_lh2_demo.py" \
             "$GITHUB_WORKSPACE/python_qes/tests/test_ffi_lh2.py" tests/
          python -m pytest -q tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plumeswift-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plumeswift-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
